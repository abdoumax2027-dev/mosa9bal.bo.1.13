<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>إدارة المعرض - فوج المستقبل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.box{background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(42,18,65,.1);padding:1.8rem;margin-bottom:1.6rem}
.box h2{color:var(--p);font-size:1.3rem;margin-bottom:1rem}
.login{max-width:430px;margin:3rem auto}
.field{margin-bottom:1rem}
label{display:block;font-weight:700;font-size:.93rem;margin-bottom:.3rem}
input,select,textarea{width:100%;padding:.75rem 1rem;font-size:1rem;border:1.5px solid var(--line);border-radius:12px;background:#faf8fc;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(88,43,126,.15);background:#fff}
textarea{resize:vertical;min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.drop{border:2px dashed var(--p-mid);border-radius:16px;padding:1.6rem;text-align:center;background:var(--lav);cursor:pointer;margin-bottom:1rem}
.drop:hover,.drop.over{background:var(--lav-2)}
.drop b{color:var(--p);font-family:'Cairo'}
.prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:.5rem;margin-bottom:1rem}
.prev img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.msg{padding:.8rem 1rem;border-radius:12px;font-weight:700;margin-top:1rem;display:none}
.msg.ok{display:block;background:#e8f6ee;color:#0d5a34}
.msg.err{display:block;background:#fdeceb;color:var(--danger)}
.msg.info{display:block;background:var(--lav-2);color:var(--p)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-block:1.5rem 1rem}
.out{background:transparent;border:1.5px solid var(--p);color:var(--p);padding:.4rem 1.2rem;border-radius:999px;font-weight:700;cursor:pointer}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem}
.it{background:var(--lav);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.it img{width:100%;aspect-ratio:4/3;object-fit:cover}
.it div{padding:.6rem .8rem;flex:1}
.it b{font-family:'Cairo';font-size:.92rem;line-height:1.4;display:block}
.it small{color:var(--muted)}
.it button{border:0;background:#fdeceb;color:var(--danger);font-weight:700;padding:.5rem;cursor:pointer}
.it button:hover{background:var(--danger);color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="index.html"><img src="logo.png" alt="" class="logo"><b>إدارة المعرض</b></a>
    <nav><a href="gallery.html">عرض المعرض</a><a href="index.html">الرئيسية</a></nav>
  </div>
</header>

<main class="wrap">
  <!-- تسجيل الدخول -->
  <div class="box login" id="loginBox">
    <h2>تسجيل دخول المسؤول</h2>
    <form id="loginForm">
      <div class="field"><label for="em">البريد الإلكتروني</label><input type="email" id="em" required dir="ltr" autocomplete="username"></div>
      <div class="field"><label for="pw">كلمة المرور</label><input type="password" id="pw" required dir="ltr" autocomplete="current-password"></div>
      <button class="btn purple" style="width:100%" type="submit">دخول</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>

  <!-- لوحة الإدارة -->
  <div id="panel" class="hidden">
    <div class="bar2"><h2 style="color:var(--p)">لوحة الإدارة</h2><button class="out" id="logout" type="button">تسجيل الخروج</button></div>

    <div class="box">
      <h2>إضافة صور جديدة</h2>
      <form id="upForm">
        <div class="drop" id="drop"><b>اضغط لاختيار الصور</b> أو اسحبها إلى هنا<br><small>يمكن اختيار عدة صور دفعة واحدة، وسيتم تصغيرها تلقائيًا</small></div>
        <input type="file" id="files" accept="image/*" multiple class="hidden">
        <div class="prev" id="prev"></div>
        <div class="row">
          <div class="field"><label for="title">عنوان النشاط</label><input id="title" required placeholder="مثال: مخيم الصيف 2026"></div>
          <div class="field"><label for="date">تاريخ النشاط</label><input type="date" id="date" required></div>
          <div class="field"><label for="cat">نوع النشاط</label>
            <select id="cat"><option>مخيم</option><option>رحلة</option><option>قرآن كريم</option><option>ورشة</option><option>خدمة تطوعية</option><option>أخرى</option></select></div>
        </div>
        <div class="field"><label for="desc">وصف (اختياري)</label><textarea id="desc" maxlength="300"></textarea></div>
        <button class="btn purple" id="upBtn" type="submit">رفع الصور</button>
        <div class="msg" id="upMsg"></div>
      </form>
    </div>

    <div class="box">
      <h2>الصور المنشورة</h2>
      <div class="list" id="list"></div>
      <div style="text-align:center;margin-top:1rem"><button class="out hidden" id="moreBtn">عرض المزيد</button></div>
      <p id="emptyMsg" style="color:var(--muted);text-align:center" class="hidden">لا توجد صور بعد.</p>
    </div>
  </div>
</main>

<script type="module">
import {app,db,configured} from './firebase-config.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {collection,doc,writeBatch,serverTimestamp,query,orderBy,limit,startAfter,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=id=>document.getElementById(id);
const show=(el,cls,txt)=>{el.className='msg '+cls;el.textContent=txt};
const esc=(s='')=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('date').valueAsDate=new Date();
if(!configured)show($('loginMsg'),'err','لم يتم ربط Firebase بعد. عدّل ملف firebase-config.js.');
const auth=getAuth(app);

/* ---- الدخول ---- */
$('loginForm').onsubmit=async e=>{
  e.preventDefault();
  try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);$('loginMsg').className='msg'}
  catch(err){show($('loginMsg'),'err','البريد أو كلمة المرور غير صحيحة.')}
};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  $('loginBox').classList.toggle('hidden',!!u);
  $('panel').classList.toggle('hidden',!u);
  if(u){resetList();loadList()}
});

/* ---- اختيار الصور ---- */
let picked=[];
$('drop').onclick=()=>$('files').click();
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};
$('drop').ondragleave=()=>$('drop').classList.remove('over');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');setFiles(e.dataTransfer.files)};
$('files').onchange=e=>setFiles(e.target.files);
function setFiles(fl){
  picked=[...fl].filter(f=>f.type.startsWith('image/'));
  $('prev').innerHTML=picked.map(f=>`<img src="${URL.createObjectURL(f)}" alt="">`).join('');
}

/* ---- تصغير الصورة ---- */
async function compress(file,max,q){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);
  let url=c.toDataURL('image/jpeg',q);
  while(url.length>900000&&q>0.35){q-=0.08;url=c.toDataURL('image/jpeg',q)}
  return {url,w,h};
}

/* ---- الرفع ---- */
$('upForm').onsubmit=async e=>{
  e.preventDefault();
  if(!picked.length){show($('upMsg'),'err','اختر صورة واحدة على الأقل.');return}
  $('upBtn').disabled=true;
  let ok=0;
  for(let i=0;i<picked.length;i++){
    show($('upMsg'),'info',`جارٍ رفع الصورة ${i+1} من ${picked.length}...`);
    try{
      const full=await compress(picked[i],1400,.8);
      const thumb=await compress(picked[i],480,.72);
      const ref=doc(collection(db,'photos')),refF=doc(db,'photoFull',ref.id);
      const b=writeBatch(db);
      b.set(ref,{title:$('title').value.trim(),desc:$('desc').value.trim(),category:$('cat').value,date:$('date').value,thumb:thumb.url,w:thumb.w,h:thumb.h,createdAt:serverTimestamp()});
      b.set(refF,{data:full.url});
      await b.commit();ok++;
    }catch(err){console.error(err);show($('upMsg'),'err',`فشل رفع الصورة ${i+1}. تأكد من تسجيل الدخول ومن قواعد Firestore.`);$('upBtn').disabled=false;return}
  }
  show($('upMsg'),'ok',`تم رفع ${ok} صورة بنجاح.`);
  picked=[];$('prev').innerHTML='';$('files').value='';$('title').value='';$('desc').value='';
  $('upBtn').disabled=false;resetList();loadList();
};

/* ---- القائمة والحذف ---- */
let last=null,done=false;
function resetList(){last=null;done=false;$('list').innerHTML=''}
async function loadList(){
  const q=query(collection(db,'photos'),orderBy('createdAt','desc'),...(last?[startAfter(last)]:[]),limit(24));
  try{
    const snap=await getDocs(q);
    $('list').insertAdjacentHTML('beforeend',snap.docs.map(d=>{const p=d.data();
      return `<div class="it" data-id="${d.id}"><img src="${p.thumb}" alt=""><div><b>${esc(p.title)}</b><small>${esc(p.category||'')} • ${esc(p.date||'')}</small></div><button type="button" data-del="${d.id}">حذف</button></div>`}).join(''));
    last=snap.docs[snap.docs.length-1]||last;done=snap.size<24;
  }catch(e){console.error(e)}
  $('moreBtn').classList.toggle('hidden',done);
  $('emptyMsg').classList.toggle('hidden',!!$('list').children.length);
}
$('moreBtn').onclick=loadList;
$('list').onclick=async e=>{
  const id=e.target.dataset.del;if(!id)return;
  if(!confirm('هل تريد حذف هذه الصورة نهائيًا؟'))return;
  try{
    const b=writeBatch(db);b.delete(doc(db,'photos',id));b.delete(doc(db,'photoFull',id));await b.commit();
    $('list').querySelector(`[data-id="${id}"]`).remove();
    $('emptyMsg').classList.toggle('hidden',!!$('list').children.length);
  }catch(err){alert('تعذّر الحذف.')}
};
</script>
</body>
</html>
